# Configuração do Web Scraper de Imóveis
# Londrina/PR - Zona Sul

# URLs de Busca
# Ajuste conforme necessário para diferentes filtros e regiões

[urls]
# OLX - Apartamentos à Venda
# Filtros: Londrina/PR, Preço máximo R$ 700.000
olx_venda = https://www.olx.com.br/imoveis/venda/apartamentos/estado-pr/regiao-de-londrina/londrina?pe=700000

# OLX - Apartamentos para Aluguel
# Filtros: Londrina/PR
olx_aluguel = https://www.olx.com.br/imoveis/aluguel/apartamentos/estado-pr/regiao-de-londrina/londrina

# ZAP Imóveis - Apartamentos à Venda
# Filtros: Londrina/PR, Preço máximo R$ 700.000
zap_venda = https://www.zapimoveis.com.br/venda/apartamentos/pr+londrina/?onde=,Paraná,Londrina,,,,,city,BR>Paraná>NULL>Londrina&precoate=700000

# ZAP Imóveis - Apartamentos para Aluguel
# Filtros: Londrina/PR
zap_aluguel = https://www.zapimoveis.com.br/aluguel/apartamentos/pr+londrina/?onde=,Paraná,Londrina,,,,,city,BR>Paraná>NULL>Londrina


[scraping]
# Configurações de scraping
delay_min = 1
delay_max = 3
max_paginas = 5
timeout = 30


[filters]
# Valor máximo para imóveis à venda (em R$)
valor_maximo = 700000

# Percentual mínimo abaixo do mercado para considerar oportunidade
percentual_oportunidade = 10


[selectors]
# Seletores CSS alternativos para OLX
# Atualize se a estrutura do site mudar
olx_card_selector_1 = a[data-ds-component="DS-NewAdCard"]
olx_card_selector_2 = li.ad-list-item
olx_title_selector = h2, h3
olx_price_selector = span[data-testid="price"]
olx_location_selector = span[data-testid="location"]

# Seletores CSS alternativos para ZAP Imóveis
# Atualize se a estrutura do site mudar
zap_card_selector_1 = div.result-card
zap_card_selector_2 = article.card-container
zap_title_selector = h2.card-title, h3.property-title
zap_price_selector = p.price, span.valor
zap_area_selector = span[itemprop="floorSize"], li.area


[notes]
# IMPORTANTE: CSS selectors podem mudar conforme os sites atualizam seu HTML
# Se o scraper parar de funcionar:
# 1. Acesse as páginas de OLX e ZAP Imóveis
# 2. Inspecione os elementos (F12)
# 3. Atualize os seletores nesta configuração
# 4. Teste novamente
